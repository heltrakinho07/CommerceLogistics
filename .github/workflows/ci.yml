name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r services/api/requirements-dev.txt
      - run: PYTHONPATH=services/api python ml/train_shipping.py
      - run: PYTHONPATH=services/api pytest -q services/api/tests
      - run: PYTHONPATH=services/api python ml/evaluate_search.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  e2e:
    name: browser-e2e
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r services/api/requirements.txt
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: PYTHONPATH=services/api python ml/train_shipping.py
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
  docker-smoke:
    name: docker-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production containers
        run: docker compose up --build -d --wait
      - name: Verify API, reverse proxy and frontend
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['catalog_size']>=12"
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['demo_data']"
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -q "CommerceLogistics AI"
          curl --fail --silent --show-error "http://127.0.0.1:5173/api/search?q=laptop" | python -c "import sys,json; d=json.load(sys.stdin); assert d['results']"
      - if: always()
        run: |
          docker compose logs --tail 80
          docker compose down --remove-orphans

  render-smoke:
    name: render-production-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Render production image
        run: docker build --file Dockerfile.render --tag commerce-render:ci .
      - name: Start Render-like container
        run: docker run --rm -d --name commerce-render-ci --env PORT=10000 --publish 10000:10000 commerce-render:ci
      - name: Check React, API, and static assets from the same URL
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:10000"
          for attempt in range(45):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      health = json.load(response)
                  break
              except (OSError, TimeoutError):
                  time.sleep(2)
          else:
              raise RuntimeError("Render-style service never became healthy")

          assert health["status"] == "ok" and health["catalog_size"] >= 12
          with urllib.request.urlopen(base + "/", timeout=10) as response:
              html = response.read().decode("utf-8")
          assert "CommerceLogistics AI" in html
          js = re.search(r'src="([^"]+\.js)"', html)
          assert js, "Compiled JS bundle not referenced in the HTML"
          with urllib.request.urlopen(base + js.group(1), timeout=10) as response:
              assert response.status == 200 and "javascript" in response.headers.get("Content-Type", "")
          with urllib.request.urlopen(base + "/api/search?q=laptop", timeout=10) as response:
              assert json.load(response)["results"]
          with urllib.request.urlopen(base + "/docs", timeout=10) as response:
              assert response.status == 200
          request = urllib.request.Request(
              base + "/api/quote",
              data=json.dumps({
                  "origin": "Lisboa", "destination": "Maputo",
                  "weight_kg": 2, "length_cm": 30,
                  "width_cm": 20, "height_cm": 15,
                  "service": "standard",
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              quote = json.load(response)
          assert quote["is_demo"] is True and quote["total_mzn"] > 0
          forecast_request = urllib.request.Request(
              base + "/api/quote/predict",
              data=request.data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(forecast_request, timeout=10) as response:
              prediction = json.load(response)
          assert prediction["method"] == "trained_regression" and prediction["predicted_cost_mzn"] > 0
          assert prediction["source"] == "synthetic_generated_simulation"
          with urllib.request.urlopen(base + "/api/models/shipping/metrics", timeout=10) as response:
              metrics = json.load(response)
          assert metrics["test_samples"] > 0
          print("Render Docker smoke: React / API / bundle / quote OK")
          PY
      - name: Collect diagnostic logs
        if: always()
        run: |
          docker logs commerce-render-ci || true
          docker rm -f commerce-render-ci || true
