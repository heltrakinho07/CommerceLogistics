name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -r services/api/requirements-dev.txt
      - run: PYTHONPATH=services/api pytest -q services/api/tests
      - run: PYTHONPATH=services/api python ml/evaluate_search.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  e2e:
    name: browser-e2e
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r services/api/requirements.txt
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
  docker-smoke:
    name: docker-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start production containers
        run: docker compose up --build -d --wait
      - name: Verify API, reverse proxy and frontend
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['catalog_size']>=12"
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['demo_data']"
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -q "CommerceLogistics AI"
          curl --fail --silent --show-error "http://127.0.0.1:5173/api/search?q=laptop" | python -c "import sys,json; d=json.load(sys.stdin); assert d['results']"
      - if: always()
        run: |
          docker compose logs --tail 80
          docker compose down --remove-orphans
